<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apogea — Discord Feed (proof of concept)</title>
<style>
  :root{--ink:#0b0e14;--panel:#12161f;--line:#232a38;--text:#c8d0dc;--dim:#6b7686;--torch:#f0a53c}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink);min-height:100%;font-family:"Lucida Console",Monaco,monospace;color:var(--text)}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);
    padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;z-index:5}
  header h1{font-size:13px;letter-spacing:.18em;color:var(--torch);font-weight:700}
  header .sub{font-size:10px;color:var(--dim);letter-spacing:.06em;flex:1;min-width:200px}
  select{background:var(--ink);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:11px;padding:8px 10px;outline:none}
  select:focus{border-color:var(--torch)}
  #status{font-size:10px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
  main{max-width:760px;margin:0 auto;padding:20px 18px 60px}
  article{border:1px solid var(--line);border-left:2px solid var(--torch);
    background:var(--panel);padding:14px 16px;margin-bottom:12px}
  .m-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .m-head img{width:28px;height:28px;border-radius:50%;background:#232a38;flex:none}
  .m-head .who{font-size:12px;color:var(--text)}
  .m-head .when{font-size:9px;color:var(--dim);margin-left:auto}
  .m-body{font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text)}
  .m-embeds{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .m-embed{border:1px solid var(--line);border-left:3px solid var(--dim);
    background:var(--ink);padding:10px 12px;font-size:11px}
  .m-embed a{color:var(--torch)}
  .m-embed .t{font-weight:700;margin-bottom:4px}
  .m-att{margin-top:10px}
  .m-att img{max-width:100%;max-height:320px;border:1px solid var(--line);display:block}
  .m-att a{display:inline-block;margin-top:6px;font-size:10px;color:var(--dim);
    text-decoration:none;border-bottom:1px dotted var(--line)}
  .m-src{margin-top:10px;font-size:9px;color:var(--dim)}
  .m-src a{color:var(--dim)}
  #empty{padding:40px 0;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.15em}
</style>
</head>
<body>
<header>
  <h1>DISCORD FEED &mdash; POC</h1>
  <div class="sub">Dados gerados pelo GitHub Action <b>discord-sync</b> a cada 4h</div>
  <select id="channel">
    <option value="announcements">announcements</option>
    <option value="changes">changes</option>
    <option value="in-game-roles">in-game-roles</option>
    <option value="posts-and-articles">posts-and-articles</option>
  </select>
  <div id="status">&mdash;</div>
</header>
<main id="main"></main>

<script>
const BASE = "https://raw.githubusercontent.com/shimaski/apogea-reverse/main/discord/data/";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function embedsHTML(embeds){
  if(!embeds || !embeds.length) return "";
  let h = '<div class="m-embeds">';
  for(const e of embeds){
    h += '<div class="m-embed">';
    if(e.title) h += '<div class="em-title">'+esc(e.title)+'</div>';
    if(e.description) h += '<div>'+esc(e.description.slice(0,400))+'</div>';
    if(e.url) h += '<div><a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.url)+'</a></div>';
    h += '</div>';
  }
  return h+"</div>";
}

function attachmentsHTML(atts){
  if(!atts || !atts.length) return "";
  let h = '<div class="m-att">';
  const img = atts.filter(a=>/^image\//.test(a.content_type||""));
  const rest = atts.filter(a=>!/^image\//.test(a.content_type||""));
  for(const a of img) h += '<img src="'+esc(a.url)+'" alt="'+esc(a.filename)+'" loading="lazy">';
  for(const a of rest) h += '<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.filename||"download")+'</a>';
  return h+"</div>";
}

function card(m){
  const a = m.author||{};
  return '<article>'+
    '<div class="m-head">'+
      (a&&a.avatar?'<img src="'+esc(a.avatar)+'" alt="">':'<img alt="">')+
      '<span class="font">'+esc((a&&a.display_name)||(a&&a.username)||"unknown")+'</span>'+
      '<span class="when">'+esc((m.published_at||"").replace("T"," ").replace(/\.\d+Z?$/," UTC"))+'</span>'+
    '</div>'+
    '<div class="m-body">'+esc(m.content)+'</div>'+
    embedsHTML(m.embeds)+
    attachmentsHTML(m.attachments)+
    '<div class="m-src"><a href="'+esc(m.source_url)+'" target="_blank" rel="noopener">abrir no Discord &nearr;</a></div>'+
  '</article>';
}

async function load(ch){
  const status = $("status");
  const main = $("main");
  status.textContent = "carregando...";
  try{
    const r = await fetch(BASE+ch+".json", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json();
    const msgs = (d.messages||[]).slice().reverse();
    status.textContent = d.meta
      ? (d.meta.total+" mensagens - atualizado "+d.meta.updated.slice(0,10))
      : msgs.length+" mensagens";
    main.innerHTML = msgs.length
      ? msgs.map(card).join("")
      : '<div id="empty">NENHUMA MENSAGEM</div>';
  }catch(e){
    status.textContent = "erro: "+e.message;
    main.innerHTML = '<div id="empty">FALHA AO CARREGAR<br>'+
      '<span style="font-size:9px">'+esc(e.message)+'</span></div>';
  }
}

$("channel").addEventListener("change", e=>load(e.target.value));
load($("channel").value);
</script>
</body>
</html>

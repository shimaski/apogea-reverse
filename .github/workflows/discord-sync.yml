name: discord-sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Discord channels
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python discord/fetch.py

      - name: Commit and push changes
        run: |
          git config user.name "apogea-wiki-bot"
          git config user.email "apogea-wiki-bot@users.noreply.github.com"
          git add discord/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(discord): sync channel data [skip ci]"
            git push
          fi